name: React CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        
      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build
      
      - name: Run Tests
        run: npm test

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Login into Docker Hub
        run: |
          docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" -p "${{ secrets.DOCKER_HUB_TOKEN }}"

      - name: Build Docker Image
        run: |
          docker build -t "${{ secrets.DOCKER_HUB_USERNAME }}/ci-cd-react-app:latest" .
      
      - name: Push to Docker Hub
        run: |
          docker push "${{ secrets.DOCKER_HUB_USERNAME }}/ci-cd-react-app:latest"


  deploy-to-server:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_TO_EC2 == 'true'

    steps:
      - name: Login into VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull "${{ secrets.DOCKER_HUB_USERNAME }}/ci-cd-react-app:latest"

            docker stop react-app || true
            docker rm react-app || true

            docker run -d \
              --name react-app \
              -p 80:80 \
              --restart unless-stopped \
              "${{ secrets.DOCKER_HUB_USERNAME }}/ci-cd-react-app:latest"


            