name: React CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: action/checkout@v4
      
      - name: Setup Node.js
        uses: action/setup-node@v4
        with:
          node-version: '20.x'
        
      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build
      
      - name: Run Tests
        run: npm test